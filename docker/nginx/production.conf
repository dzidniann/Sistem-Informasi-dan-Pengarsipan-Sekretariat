pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Only explicitly listed NPM peers may supply forwarding headers.
    include /etc/nginx/trusted-proxies.conf;
    map $remote_addr $external_proto {
        default $scheme;
        include /etc/nginx/trusted-proto.map;
    }
    server {
        listen 8080;
        root /var/www/html/public;
        index index.php;
        client_max_body_size 25M;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        location ^~ /storage/ { rewrite ^ /index.php last; }
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include fastcgi_params.production;
            # Identify this private Nginx peer to Laravel, while the sanitized
            # client address is supplied separately in X-Forwarded-For below.
            fastcgi_param REMOTE_ADDR $server_addr;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            # Laravel trusts its own Nginx peer only. Nginx sanitizes client headers.
            fastcgi_param HTTP_X_FORWARDED_PROTO $external_proto;
            fastcgi_param HTTP_X_FORWARDED_PORT "";
            fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
            fastcgi_pass app:9000;
            fastcgi_read_timeout 130s;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
    }
}
