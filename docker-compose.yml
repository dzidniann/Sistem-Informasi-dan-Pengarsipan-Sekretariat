services:

  # Aplikasi Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim_kesekretariatan_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env.docker
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - cache_data:/var/www/html/bootstrap/cache
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - sim_network
    depends_on:
      db:
        condition: service_healthy

  # Web server yang menerima request dari browser
  webserver:
    image: nginx:stable-alpine
    container_name: sim_kesekretariatan_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sim_network
    depends_on:
      - app

  # Database MySQL
  db:
    image: mysql:8.0
    container_name: sim_kesekretariatan_db
    restart: unless-stopped
    env_file: .env.docker
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sim_network

  # phpMyAdmin, opsional, untuk lihat database lewat browser
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sim_kesekretariatan_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - sim_network
    depends_on:
      - db

  # Scheduler, jalanin tugas terjadwal seperti hapus log lama
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim_kesekretariatan_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env.docker
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - cache_data:/var/www/html/bootstrap/cache
    networks:
      - sim_network
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done"

networks:
  sim_network:
    driver: bridge

volumes:
  vendor_data:
  cache_data:
  db_data:
    driver: local
